apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  # spec.addresses (a static IP request) isn't honored by Cilium's Gateway
  # implementation here ("StaticAddress can't be used") — MetalLB assigns
  # whatever's next from the pool instead. That IP is effectively stable
  # once assigned (won't move unless this Service is deleted/recreated), so
  # DNS just points at whatever it ends up being — check
  # `kubectl get svc -n gateway-system cilium-gateway-homelab-gateway`.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: homelab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
