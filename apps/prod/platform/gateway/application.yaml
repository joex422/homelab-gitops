# Shared Gateway API entry point. Runs after MetalLB config (wave 21) since
# the Gateway provisions its own LoadBalancer Service backed by the MetalLB
# pool, and after gateway-api-crds (wave 1) / the manual Cilium
# gatewayAPI.enabled upgrade for the "cilium" GatewayClass to exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  project: platform
  source:
    repoURL: https://github.com/joex422/homelab-gitops.git
    targetRevision: main
    path: apps/prod/platform/gateway
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
