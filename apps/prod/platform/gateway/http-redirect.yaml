# Catch-all redirect for the http listener. All 6 per-service HTTPRoutes
# are now pinned to sectionName: https only (see their parentRefs) so this
# is the only route left attached to port 80 — anything that lands there
# gets bounced to https on the same host, no per-service duplication.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
