apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-homelab
spec:
  vault:
    # Must use the hostname, not the raw IP: Vault's own TLS cert
    # (CN=vault.home.joecool.work) has no IP SANs, so connecting by IP
    # fails cert verification.
    server: https://vault.home.joecool.work:443
    path: pki/sign/homelab
    caBundle: 
    auth:
      tokenSecretRef:
        name: vault-token
        key: token
