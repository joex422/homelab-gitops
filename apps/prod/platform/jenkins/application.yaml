# Runs after storage (wave 15) and MetalLB (wave 20/21) so the PVC can bind
# and the LoadBalancer Service can get an IP before Jenkins itself starts.
#
# Two sources: the Helm chart, plus a plain git source for values.yaml and
# the PostSync DNS hook Job (same combined pattern as monitoring/headlamp).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: platform
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.63
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/apps/prod/platform/jenkins/values.yaml
    - repoURL: https://github.com/joex422/homelab-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/joex422/homelab-gitops.git
      targetRevision: main
      path: apps/prod/platform/jenkins
      directory:
        include: "postsync-dns-hook.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
