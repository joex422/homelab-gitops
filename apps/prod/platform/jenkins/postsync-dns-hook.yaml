# Updates jenkins.home.joecool.work -> 192.168.1.225 on bind9 after every
# sync. The SSH key this mounts (jenkins-dns-hook-key, created directly via
# kubectl, not committed here) is deliberately restricted on the bind9 side
# via a forced `command=` in authorized_keys — it can only ever run
# /usr/local/bin/update-jenkins-dns.sh, nothing else, regardless of what
# this Job requests. Losing this key doesn't expose root shell access.
apiVersion: batch/v1
kind: Job
metadata:
  name: jenkins-dns-postsync
  namespace: jenkins
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: dns-update
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache openssh-client >/dev/null
              chmod 600 /keys/id_ed25519
              ssh -i /keys/id_ed25519 -o StrictHostKeyChecking=no root@192.168.1.206
          volumeMounts:
            - name: dns-hook-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: dns-hook-key
          secret:
            secretName: jenkins-dns-hook-key
            defaultMode: 0400
