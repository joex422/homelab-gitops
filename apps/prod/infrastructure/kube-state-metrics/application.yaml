# Prerequisite for the Elastic Agent "Kubernetes" integration's state_*
# metricsets (pod restarts, deployment/node state). Kubelet/cAdvisor metrics
# (CPU/mem per pod) come straight from each node's kubelet API and don't
# need this, but restart counts and lifecycle state do.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: prod
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 8.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-state-metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
