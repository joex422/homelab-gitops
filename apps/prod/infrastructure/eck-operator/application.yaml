# ECK operator — watches for Elasticsearch/Kibana CRs and reconciles the
# actual StatefulSets/Services/certs. Nothing monitored yet just from this;
# Elasticsearch/Kibana CRs themselves are a separate follow-up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: prod
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  # The eck-operator chart also bundles the same CRDs as eck-operator-crds,
  # so it hits the identical spec.conversion.strategy auto-default drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
