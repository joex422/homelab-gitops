# ECK operator — watches for Elasticsearch/Kibana CRs and reconciles the
# actual StatefulSets/Services/certs. Nothing monitored yet just from this;
# Elasticsearch/Kibana CRs themselves are a separate follow-up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: prod
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
    helm:
      values: |
        # CRDs are already owned exclusively by the eck-operator-crds
        # Application; leaving this chart's own installCRDs on made the two
        # Applications fight over the same objects (each sync flipped the
        # other to OutOfSync).
        installCRDs: false
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
