# Standard-channel Gateway API CRDs (GatewayClass, Gateway, HTTPRoute, etc.)
# from the upstream project. Low wave so these exist before anything that
# creates a Gateway or HTTPRoute. Uses source.kustomize (not directory) since
# config/crd/standard/ contains its own kustomization.yaml.
#
# Pinned to v1.6.1, not the latest tag: a stale ValidatingAdmissionPolicy
# (safe-upgrades.gateway.networking.k8s.io) survives on this cluster from an
# unrelated, since-removed install attempt at the original 2026-09-02
# bootstrap and refuses to let CRDs older than v1.5.0 apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd/standard
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
