# ECK's CRDs (Elasticsearch, Kibana, Beat, etc.) — must land before the
# operator itself, same ordering lesson as gateway-api before Istio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: prod
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator-crds
    targetRevision: 3.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  # Confirmed via direct diff (rendered chart vs live object): the API
  # server auto-defaults spec.conversion.strategy to "None" on every CRD
  # that doesn't declare a conversion strategy — the source manifest never
  # has this field, but the live object always does, so without this
  # ArgoCD sees permanent drift immediately after every successful sync.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
