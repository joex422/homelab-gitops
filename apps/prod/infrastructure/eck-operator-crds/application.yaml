# ECK's CRDs (Elasticsearch, Kibana, Beat, etc.) — must land before the
# operator itself, same ordering lesson as gateway-api before Istio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  project: prod
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator-crds
    targetRevision: 3.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
