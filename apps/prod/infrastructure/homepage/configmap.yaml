  widgets.yaml: |
    - greeting:
        text: Home, under control.
        text_size: 4xl
    - datetime:
        text_size: lg
        locale: en-SG
        format:
          dateStyle: medium
          timeStyle: short
  bookmarks.yaml: |
    - Reference:
      - GitOps repository:
        - abbr: GH
          href: https://github.com/joex422/homelab-gitops
      - Cloudflare dashboard:
        - abbr: CF
          href: https://dash.cloudflare.com
      - Homepage documentation:
        - abbr: HP
          href: https://gethomepage.dev
  custom.css: |
    /* Midnight workspace: stable Homepage selectors, no JavaScript required. */
    :root { color-scheme: dark; --lab-ink: #ecf4fb; --lab-muted: #99adc1; --lab-accent: #67e8d3; }
    html, body { background: #080f19 !important; color: var(--lab-ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #background { background: radial-gradient(ellipse at 12% 0%, rgba(22,109,116,.26), transparent 43%), radial-gradient(ellipse at 90% 10%, rgba(44,66,117,.28), transparent 40%), linear-gradient(160deg, #09121e, #080e18 65%) !important; }
    #background::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(127,177,204,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(127,177,204,.025) 1px, transparent 1px); background-size: 44px 44px; }
    #page_wrapper { background: radial-gradient(ellipse at 12% 0%, rgba(22,109,116,.20), transparent 48%), radial-gradient(ellipse at 95% 20%, rgba(41,63,102,.24), transparent 42%), #0a111c !important; max-width: 1440px !important; margin: 0 auto; padding: 38px 48px 24px !important; }
    #inner_wrapper { padding: 0 !important; }
    #information-widgets { margin: 20px 0 24px !important; padding: 0 8px 26px; border-bottom: 1px solid rgba(148,183,210,.12); align-items: center; }
    .information-widget-greeting { display: block; flex: 1; min-width: 0; }
    .information-widget-greeting::before { content: "JOE / HOMELAB"; display: block; color: var(--lab-accent); font-size: 11px; font-weight: 700; letter-spacing: .22em; margin-bottom: 13px; }
    .information-widget-greeting span { font-size: clamp(26px, 3vw, 40px) !important; font-weight: 650; letter-spacing: -.04em; color: #f1f7fc !important; line-height: 1.2; }
    .information-widget-greeting::after { content: "2 Proxmox hosts  /  14 guests  /  prod + dev"; display: block; color: var(--lab-muted); font-size: 12px; margin-top: 13px; letter-spacing: .03em; }
    #information-widgets-right { margin: 0 !important; flex: 0 0 auto; }
    .information-widget-datetime { color: #b1c3d4; font-size: 13px; font-variant-numeric: tabular-nums; }
    .services-group { padding: 8px !important; margin-bottom: 15px; }
    .service-group-name { font-size: 13px !important; font-weight: 600 !important; letter-spacing: .08em; text-transform: uppercase; color: #c7d8e7 !important; margin: 8px 0 2px; }
    .services-list { gap: 12px !important; margin-top: 13px !important; }
    .service-card { background: linear-gradient(135deg, rgba(24,40,56,.96), rgba(15,27,40,.95)) !important; border: 1px solid rgba(142,177,204,.14); border-radius: 16px !important; padding: 15px 12px !important; margin: 0 !important; box-shadow: 0 8px 22px rgba(0,0,0,.10) !important; min-height: 95px; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .service-card:hover { transform: translateY(-3px); border-color: rgba(103,232,211,.45); background: linear-gradient(135deg, rgba(28,50,65,.98), rgba(18,34,49,.98)) !important; box-shadow: 0 14px 30px rgba(0,0,0,.2) !important; }
    .service-icon { width: 48px !important; height: 48px; align-self: center; border-radius: 13px; background: rgba(139,174,200,.07); margin-right: 7px; }
    .service-icon img, .service-icon svg { width: 28px !important; height: 28px !important; object-fit: contain; }
    .service-name { font-size: 14px !important; font-weight: 600; color: #ecf4fc; line-height: 1.35; padding-right: 10px !important; }
    .service-description { color: #9eafc1 !important; font-size: 11px !important; font-weight: 400 !important; line-height: 1.65; margin-top: 6px; white-space: normal !important; }
    .service-tags { top: 9px !important; right: 8px !important; }
    #svc-argo-cd .service-card { border-color: rgba(103,232,211,.3); background: linear-gradient(135deg, rgba(20,58,63,.96), rgba(15,33,45,.95)) !important; }
    #svc-nexvault-dev .service-card { border-color: rgba(125,166,255,.3); }
    button { transition: background .18s ease, color .18s ease; }
    button[role="tab"] { border-radius: 10px !important; font-size: 13px !important; padding: 10px 22px !important; }
    button[role="tab"][aria-selected="true"] { background: rgba(103,232,211,.12) !important; color: #8bf4df !important; border-bottom-color: transparent !important; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--lab-accent); outline-offset: 4px; }
    .bookmark-group { padding: 8px !important; }
    .bookmark-group a { border-radius: 12px !important; border: 1px solid rgba(142,177,204,.1); background: rgba(17,30,43,.85) !important; }
    #footer { opacity: .5; font-size: 11px; }
    @media (max-width: 767px) { #page_wrapper { padding: 24px 14px !important; } #information-widgets { gap: 18px; padding-bottom: 20px; margin-top: 8px !important; } #widgets-wrap { flex-direction: column !important; align-items: flex-start; gap: 18px; } .information-widget-greeting { width: 100%; flex: 0 0 auto; } .information-widget-greeting span { font-size: 30px !important; } .information-widget-greeting::after { font-size: 11px; white-space: nowrap; } #information-widgets-right { width: 100%; } .information-widget-datetime > div { justify-content: flex-start !important; } [role="tablist"] { flex-direction: row !important; } button[role="tab"] { padding: 10px 8px !important; font-size: 12px !important; } .service-card { min-height: 91px; padding: 13px 10px !important; } .services-group { padding: 6px !important; } .services-list { gap: 10px !important; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .service-card:hover { transform: none; } }

    [role="tablist"] { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 4px; }
    button[role="tab"] { margin: 0 !important; }
    .service-icon img[src*="vault.png"] { filter: brightness(0) invert(1); }
