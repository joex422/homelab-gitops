apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Joe's Homelab
    description: Applications, infrastructure and platform services in one place.
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    hideErrors: false
    useEqualHeights: true
    disableCollapse: true
    statusStyle: dot
    target: _blank
    layout:
      Applications:
        tab: Overview
        style: row
        columns: 4
      Delivery & access:
        tab: Overview
        style: row
        columns: 4
      Observability:
        tab: Overview
        style: row
        columns: 3
      Security & network:
        tab: Overview
        style: row
        columns: 3
      Proxmox hosts:
        tab: Compute
        style: row
        columns: 3
      Production nodes:
        tab: Compute
        style: row
        columns: 3
      Development nodes:
        tab: Compute
        style: row
        columns: 3
      LXC containers:
        tab: Compute
        style: row
        columns: 3
      Other virtual machines:
        tab: Compute
        style: row
        columns: 3
      Production applications:
        tab: Platform
        style: row
        columns: 3
      Development applications:
        tab: Platform
        style: row
        columns: 3
      Reference:
        tab: Overview
        style: row
        columns: 3
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: false
    disableSearchEngineIndexing: true
  services.yaml: |
