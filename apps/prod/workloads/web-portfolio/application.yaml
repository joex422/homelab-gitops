apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-portfolio
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/joex422/web-portfolio.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: web-portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true